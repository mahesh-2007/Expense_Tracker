<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-inner">
            <span class="app-icon">💰</span>
            <div>
                <p class="eyebrow">Smart spending made simple</p>
                <h1>Expense Tracker</h1>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card form-card">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" required>
                </div>
                <button type="submit" class="btn-submit">Add Expense</button>
            </form>
            <div id="message" class="message hidden"></div>
        </div>

        <div class="card table-card">
            <h2>Recent Transactions</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th class="text-right">Amount</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="confirmModal">
        <div class="confirm-modal">
            <div class="modal-header">
                <span class="modal-icon">🗑️</span>
                <div>
                    <p class="modal-title">Are you sure?</p>
                    <p class="modal-text">This expense will be removed from your tracker. This action cannot be undone.</p>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelDelete">Cancel</button>
                <button type="button" class="btn-confirm" id="confirmDelete">Yes, delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
